<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resident Evil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="360"></canvas>
  <div id="vig"></div>
  <div id="hurt"></div>
  <div id="cross"></div>
  <div id="hud"><span id="hp">Vida 100</span><span id="kills">Abatidos 0</span><span id="ammo">Cal. 12: 6 / 18</span></div>
  <div id="msg">
    <h1>Resident Evil</h1>
    <p id="sub">Ache a <b class="exit">saída</b> (a coluna de luz verde) antes que os zumbis achem você.</p>
    <p>W A S D mover · mouse mirar · clique atirar · R recarregar · Shift correr · M mapa</p>
    <p class="go">Clique para jogar</p>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
